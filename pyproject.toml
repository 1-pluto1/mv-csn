[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mvcsn"
version = "0.1.0"
description = "Multi-View Context-Gated Character Similarity Network for Adversarial Variant Spam Detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pypinyin>=0.50.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "networkx>=3.1",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "transformers>=4.40.0",
    "streamlit>=1.32.0",
]

[tool.setuptools.packages.find]
include = ["mvcsn*", "baselines*"]
